; PHP-FPM config for the Docker/Fly.io image (devbox uses devbox.d/php/php-fpm.conf).
; Differs from devbox in clear_env = no, so JETHRO_CONF_* variables (e.g. Fly
; secrets) reach docker/conf.php, and in a smaller pool: no SMS mock server or
; parallel functional tests run against the image.
; Paths come from env vars exported by docker/entrypoint.sh.
[global]
pid = ${PHPFPM_PID_FILE}
error_log = ${PHPFPM_ERROR_LOG_FILE}
daemonize = yes

[www]
listen = ${PHPFPM_UNIX_SOCKET}
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
chdir = /
clear_env = no
