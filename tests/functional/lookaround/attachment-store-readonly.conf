<?php
// Scenario for jr-trh.8: the attachment store cannot be written.
//
// The store lives in a per-checkout directory under the system temp dir so
// the spec can make it read-only (which also prevents .staging being created)
// without touching the attachments of any other scenario. lookaround.spec.ts
// computes the same path from the checkout root.
define('ATTACHMENTS_ROOT_PATH',
	sys_get_temp_dir().'/jethro-attachment-store-readonly-'.md5(realpath(dirname(JETHRO_ROOT, 2))));
